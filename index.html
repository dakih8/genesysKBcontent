<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Trigger Genesys Workflow</title>
</head>
<body>
  <h1>Run Genesys Workflow</h1>
  <button id="run">Run Workflow</button>

  <script>
    const WEBHOOK_URL = "dddddddddddddddd";

    const params = new URLSearchParams(window.location.search);
    const customerId = params.get("customerId") || "";

    document.getElementById("run").addEventListener("click", async () => {
      const payload = {
        someKey: "start-workflow",
        customerId: customerId,
        source: "simple-webpage"
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert(res.ok ? "Webhook sent" : "Failed to send webhook");
      } catch (err) {
        alert("Failed to send webhook");
        console.error(err);
      }
    });
  </script>
</body>
</html>
