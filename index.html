<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Trigger Genesys Workflow</title>
</head>
<body>
  <h1>Run Genesys Workflow</h1>
  <button id="run">Run Workflow</button>

  <script>
    const WEBHOOK_URL = "https://api.mypurecloud.ie/platform/api/v2/integrations/webhooks/6ea1bcefbb6aa6777ef3ae04306f3a4c30a72077dc21e12d7f2c272c9f7193d10fc2db503d5ba8c3f58b8bf05575b12c/events";

    const params = new URLSearchParams(window.location.search);
    const customerId = params.get("customerId") || "";

    document.getElementById("run").addEventListener("click", async () => {
      const payload = {
        someKey: "start-workflow",
        customerId: customerId,
        source: "simple-webpage"
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert(res.ok ? "Webhook sent" : "Failed to send webhook");
      } catch (err) {
        alert("Failed to send webhook");
        console.error(err);
      }
    });
  </script>
</body>
</html>
